[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-workflow-disaggregated-residency"
version = "0.2.0"
description = "ECPA-bound StateAxis workflow residency decision and local-recovery authority"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-workflow-disaggregated-residency" = "stateaxis_workflow_disaggregated_residency"

[project.entry-points."stateaxis.mod_handlers"]
workflow_disaggregated_residency = "stateaxis_workflow_disaggregated_residency:workflow_disaggregated_residency"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_workflow_disaggregated_residency"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
